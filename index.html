<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reception Team">
<title>Reception Team</title>
<style>
:root{color-scheme:dark;--bg:#000;--sf:#0e0f12;--inp:#17181c;--ink:#e7e9ee;--mut:#8a909c;--ln:#23252b;--pri:#6ea8fe;--on:#071226;--ok:#34d399;--late:#fbbf24;--abs:#f87171;--lv:#a78bfa;--off:#6b7280;--rest:#38bdf8;--out:#262932;--end:#fb923c;box-sizing:border-box;padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.w{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:700;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.sub,small{color:var(--mut);font-size:14px}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--ln);margin-bottom:16px;-webkit-overflow-scrolling:touch}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;font:inherit;color:var(--mut);cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}
button,input,select{font:inherit;color:var(--ink)}
input,select{background:var(--inp);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%;max-width:100%;min-width:0;min-height:44px;font-size:16px}
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;text-align:start}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.btn.g{background:none;color:var(--pri);border:1px solid var(--pri)}
.btn.r{background:none;color:var(--abs);border:1px solid var(--abs)}
.btn.big{width:100%;font-size:18px;padding:15px}
.btn.out{background:var(--out);color:var(--ink);border:1px solid var(--ln)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.row>*,.g2>*{min-width:0}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.late{color:var(--late)}.abs{color:var(--abs)}.leave{color:var(--lv)}.off,.wait{color:var(--off)}.rest{color:var(--rest)}
.cal{width:max-content;min-width:0;font-size:12px;text-align:center}
.cal th,.cal td{padding:6px 4px;border-bottom:1px solid var(--ln);border-left:1px solid var(--ln);text-align:center}
.cal .cn{position:sticky;left:0;background:var(--sf);text-align:start;min-width:100px;max-width:110px;font-size:13px;z-index:1}
.cal .cc{min-width:66px;line-height:1.25}
.cal .today{background:rgba(110,168,254,.16)}
.cal .meRow{font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin-top:10px;font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:15px}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:500}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.sum b{font-size:26px;display:block;line-height:1.2}
.tm{display:flex;gap:6px;min-width:0}.tm input{flex:1;min-width:0;width:100%}.row .tm{flex:1;max-width:260px}
.act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
details{border-top:1px solid var(--ln);padding:8px 0}summary{cursor:pointer;font-weight:600}
details p{margin:4px 0;font-size:14px}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap}
.logo{flex:none;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#8ab8ff,#4f7cf0);display:flex;align-items:center;justify-content:center;color:#071226;box-shadow:0 4px 14px rgba(79,124,240,.35)}
.brand .dt{flex:none;text-align:end;font-size:13px}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px 6px 6px 14px;margin-bottom:12px}
.userbar span{font-weight:600}
.userbar .btn{min-height:36px;padding:6px 14px}
h1{margin:0}

async function api(path,o){o=o||{};const hd=Object.assign({},JH,o.headers||{});if(SESS&&!o.anon){await refreshTok();hd.Authorization='Bearer '+SESS.access_token}
 return raw(path,{method:o.method||'GET',headers:hd,body:o.body===undefined?undefined:JSON.stringify(o.body)})}

 at.forEach(r=>{(N.att[r.day]=N.att[r.day]||{})[r.staff_id]={in:hm(r.check_in),out:hm(r.check_out),dist:r.dist,via:(r.via==='QR'||r.via==='GPS')?r.via:undefined,dev:r.device_id,dl:r.device_label,fl:r.flag?{k:r.flag,of:r.flag_of}:undefined,rv:r.reviewed?1:undefined}});

const BIO_KEY='rt_bio';
const bioGet=()=>{try{return JSON.parse(localStorage.getItem(BIO_KEY))}catch(e){return null}};
async function bioEnable(){const pin=($('#bpin')||{}).value||'';
 try{await tokenReq(SESS.user.email,pw(pin))}catch(e){msg={t:'Incorrect PIN',c:'abs'};return render()}
 const nb=NB();
 try{
  if(nb){const a=await nb.isAvailable();if(!a||!a.isAvailable)throw new Error('Fingerprint not available');
   await nb.verifyIdentity({reason:'Turn on fingerprint sign-in',title:'Reception Team',subtitle:'Confirm with your fingerprint or face'});
   await nb.setCredentials({username:SESS.user.email,password:pw(pin),server:BIOSRV});localStorage.setItem(BIO_KEY,JSON.stringify({native:true,email:SESS.user.email}))}
  else{if(!window.PublicKeyCredential)throw new Error('No fingerprint support in this browser');
   const c=await navigator.credentials.create({publicKey:{challenge:rnd(),rp:{name:'Reception Team'},user:{id:new TextEncoder().encode(U.id),name:SESS.user.email,displayName:'Reception Team'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
   localStorage.setItem(BIO_KEY,JSON.stringify({email:SESS.user.email,pw:pw(pin),cred:b64(c.rawId)}))}
  msg={t:'Fingerprint / Face ID is now enabled on this phone.',c:'ok'}}
 catch(e){msg={t:'Could not enable it. '+bioHint()+(e&&e.message?' ('+String(e.message).slice(0,80)+')':''),c:'abs'}}
 render()}
function bioOff(){const nb=NB();if(nb){try{nb.deleteCredentials({server:BIOSRV})}catch(e){}}try{localStorage.removeItem(BIO_KEY)}catch(e){}msg={t:'Fingerprint sign-in removed from this phone.',c:'ok'};render()}
async function bioLogin(){const b=bioGet();
 if(!b){lm='No fingerprint set up on this phone. Sign in with your PIN, then enable it.';return render()}
 try{const nb=NB();
  if(b.native){if(!nb)throw new Error('Native fingerprint plugin missing');await nb.verifyIdentity({reason:'Sign in',title:'Reception Team',subtitle:'Use your fingerprint or face'});const c=await nb.getCredentials({server:BIOSRV});await signInPw(c.username,c.password)}
  else{await navigator.credentials.get({publicKey:{challenge:rnd(),allowCredentials:[{type:'public-key',id:unb(b.cred)}],userVerification:'required',timeout:60000}});await signInPw(b.email,b.pw)}
  lm='';await enter()}
 catch(e){lm=/invalid|credential/i.test(errTx(e))?'Your PIN changed. Sign in with the PIN, then enable fingerprint again.':'Fingerprint sign-in was cancelled or failed. Use your PIN. ('+String(errTx(e)).slice(0,60)+')';render()}}

function punchErr(e){const m=errTx(e),o=m.match(/outside_area:(\d+)/);let t;
 if(o)t='You are outside the office area ('+o[1]+' m away). You can also scan the office QR code.';
 else if(/no_location/.test(m))t='Your manager has not set the office location yet. You can scan the office QR code instead.';
 else if(/already_in/.test(m))t='You already checked in today.';
 else if(/not_in/.test(m))t='Please check in first.';
 else if(/bad_code/.test(m)){scan='bad';scanCode='';t='That QR code is not valid for today.'}

async function doPunch(kind,o){
 try{const r=await rpc('punch',{p_kind:kind,p_lat:o.lat==null?null:o.lat,p_lng:o.lng==null?null:o.lng,p_code:o.code||null,p_device:devId(),p_label:devTag()});
  await loadAll();msg={t:(kind==='in'?'Checked in at ':'Checked out at ')+t12(hm(r.at)),c:'ok'};
  if(r.flag)msg.t+='. Note: this phone is not linked to you, your manager will see it.'}
 catch(e){msg=punchErr(e)}
 render()}
function punch(t){
 if(scanCode&&scan==='ok'&&qrDay===today())return doPunch(t,{code:scanCode});
 if(!navigator.geolocation){msg={t:'Location is not supported on this device.',c:'abs'};return render()}
 msg={t:'Checking your location...',c:'late'};render();
 navigator.geolocation.getCurrentPosition(p=>doPunch(t,{lat:p.coords.latitude,lng:p.coords.longitude}),()=>{msg={t:'Please allow location access, or scan the office QR code.',c:'abs'};render()},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}

 doPunch('out',{code})}

async function dedSt(id){const x=S.ded.find(y=>y.id===id);try{await upd('deductions','id=eq.'+id,{status:x.st==='ok'?'waived':'ok'});await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function dedDel(id){if(!confirm('Delete this deduction?'))return;try{await del('deductions','id=eq.'+id);await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function addHol(){const d=$('#hd').value;if(!d)return;try{await ins('holidays',{day:d,name:$('#hn').value||'Official holiday'});await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function delHol(id){try{await del('holidays','id=eq.'+id);await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}

/* ---- team, settings, devices ---- */
function ed(id,k,v){const m={name:'name',ann:'annual',from:'start_date'}[k];if(!m)return;const s=S.staff.find(x=>x.id===id);if(s)s[k]=v;const p={};p[m]=(k==='from'&&!v)?null:v;upd('profiles','id=eq.'+id,p).catch(e=>alert('Could not save: '+errTx(e)))}
async function resetPin(id,v,el){if(!v)return;if(!/^\d{4,8}$/.test(v)){alert('PIN must be 4 to 8 digits');return}
 try{await rpc('set_user_password',{p_user:id,p_password:pw(v)});if(el)el.value='';alert('PIN updated')}catch(e){alert('Could not update: '+errTx(e))}}
async function addEmp(){const n=$('#en').value.trim(),p=$('#ep').value,f=$('#es').value;
 if(!n||!/^\d{4,8}$/.test(p)||!f)return alert('Please enter a name, a PIN of 4 to 8 digits and a start date');
 const email='e'+Array.from(crypto.getRandomValues(new Uint8Array(5))).map(x=>x.toString(16).padStart(2,'0')).join('')+DOM;
 try{const d=await raw('/auth/v1/signup',{method:'POST',headers:JH,body:JSON.stringify({email,password:pw(p),data:{name:n}})});
  const id=(d&&d.user&&d.user.id)||(d&&d.id);if(!id)throw new Error('Sign-up did not return an id');
  await approveEmp(id,n,+$('#ea').value||0,f);await loadAll();render();alert('Employee added')}catch(e){alert('Could not add: '+errTx(e))}}
async function approveEmp(id,n,ann,from){await upd('profiles','id=eq.'+id,{approved:true,name:n,annual:ann,start_date:from});
 await upsert('weekly_schedule',[0,1,2,3,4,5,6].map(i=>({staff_id:id,dow:i,start_time:i<5?'09:00':null,end_time:i<5?'17:00':null})),'staff_id,dow')}
async function approvePend(id){const p=S.pend.find(x=>x.id===id);try{await approveEmp(id,p.name,p.annual||21,today());await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function rejectPend(id){if(!confirm('Remove this sign-up request?'))return;try{await del('profiles','id=eq.'+id);await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function empLeft(id){const s=S.staff.find(x=>x.id===id);if(!confirm('Mark '+s.name+' as resigned? Their history stays in the reports and they can no longer sign in.'))return;
 try{await upd('profiles','id=eq.'+id,{active:false,left_date:today()});await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function rehire(id){try{await upd('profiles','id=eq.'+id,{active:true,left_date:null});await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
function setOffice(){if(!navigator.geolocation){alert('Location is not supported on this device');return}
 navigator.geolocation.getCurrentPosition(async p=>{try{await upd('settings','id=eq.1',{office_lat:p.coords.latitude,office_lng:p.coords.longitude});await loadAll();render();alert('Office location saved')}catch(e){alert('Could not save: '+errTx(e))}},()=>alert('Please allow location access and try again'),{enableHighAccuracy:true,timeout:15000})}
function setRad(v){S.set.rad=+v;upd('settings','id=eq.1',{radius:+v}).catch(e=>alert('Could not save: '+errTx(e)))}
function setGrace(v){S.set.grace=+v;upd('settings','id=eq.1',{grace:+v}).catch(e=>alert('Could not save: '+errTx(e)))}
async function man(d0){const d=$('#md').value,id=$('#ms').value;if(!d||!id)return;
 try{if(d0)await del('attendance','staff_id=eq.'+id+'&day=eq.'+d);
  else{const i=$('#mi').value,o=$('#mo').value;await upsert('attendance',[{staff_id:id,day:d,check_in:i?new Date(d+'T'+i).toISOString():null,check_out:o?new Date(d+'T'+o).toISOString():null,via:'manual',flag:null,flag_of:null,reviewed:true}],'staff_id,day')}
  await loadAll();render();alert('Saved')}catch(e){alert('Could not save: '+errTx(e))}}
async function trustDev(d,sid){const r=(S.att[d]||{})[sid];if(!r||!r.dev)return;const b=S.devs[r.dev];
 if(b&&b.sid!==sid&&!confirm('This phone is linked to '+nm(b.sid)+'. Link it to '+nm(sid)+' instead?'))return;
 try{await upsert('devices',[{device_id:r.dev,staff_id:sid,label:r.dl||''}],'device_id');await upd('attendance','staff_id=eq.'+sid+'&device_id=eq.'+r.dev,{flag:null,flag_of:null});await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function dismissFl(d,sid){try{await upd('attendance','staff_id=eq.'+sid+'&day=eq.'+d,{reviewed:true});await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
async function unlinkDev(id){const b=S.devs[id];if(!b||!confirm('Unlink this phone from '+nm(b.sid)+'? Their next sign-in on a phone with no linked employee will link it again.'))return;
 try{await del('devices','device_id=eq.'+id);await loadAll()}catch(e){alert('Could not save: '+errTx(e))}render()}
function vAdm(){
 const hl=S.hol.map(x=>`<div class="row"><span>${h(x.n)} · ${fd(x.d)}</span><button type="button" class="btn r" onclick="delHol('${x.id}')">Remove</button></div>`).join('');
 const st=ACT().map(s=>`<div class="g2" style="margin-bottom:8px"><input value="${h(s.name)}" onchange="ed('${s.id}','name',this.value)"><span class="tm"><input placeholder="New PIN" inputmode="numeric" onchange="resetPin('${s.id}',this.value,this)"><input type="number" value="${s.ann}" onchange="ed('${s.id}','ann',+this.value)"></span></div><div class="act" style="margin:-2px 0 12px;align-items:center"><span class="sub">Start date</span><input type="date" value="${s.from||''}" onchange="ed('${s.id}','from',this.value)" style="width:auto;flex:1"><button type="button" class="btn r" onclick="empLeft('${s.id}')">Resign</button></div>`).join('');
 const pend=S.pend.length?`<div class="box"><b>Sign-up requests</b><p class="sub" style="margin:4px 0 8px">People who created an account and are waiting for approval.</p>${S.pend.map(p=>`<div class="row"><span>${h(p.name)}</span><span class="act" style="margin:0"><button type="button" class="btn" style="min-height:36px;padding:4px 12px" onclick="approvePend('${p.id}')">Approve</button><button type="button" class="btn r" style="min-height:36px;padding:4px 12px" onclick="rejectPend('${p.id}')">Remove</button></span></div>`).join('')}</div>`:'';
 return`${bioBox()}
 <div class="box"><b>Office location</b><p class="sub" style="margin:4px 0">${S.set.office?'Set ✓ ('+S.set.office.lat.toFixed(4)+', '+S.set.office.lng.toFixed(4)+')':'Not set yet'}</p><label>Allowed distance (meters)</label><input type="number" min="20" value="${S.set.rad||150}" onchange="setRad(this.value)"><div class="act"><button type="button" class="btn" onclick="setOffice()">Set office location from where I am now</button></div><small>Stand inside the office when you press it. Employees can only check in or out within the allowed distance.</small></div>
 <div class="box"><b>Official holidays</b> <small>(each one adds a day to every employee's balance)</small><div class="g2"><div><label>Date</label><input id="hd" type="date" value="${today()}"></div><div><label>Name</label><input id="hn"></div></div><div class="act"><button type="button" class="btn" onclick="addHol()">Add</button></div>${hl?'<div style="margin-top:10px">'+hl+'</div>':''}</div>
 ${pend}
 <div class="box"><b>Team</b> <small>(name · set a new PIN · annual days)</small><div style="margin-top:8px">${st||'<small>No employees yet.</small>'}</div></div>
 <div class="box"><b>Add new employee</b><label>Name</label><input id="en"><div class="g2"><div><label>PIN (4 to 8 digits)</label><input id="ep" inputmode="numeric"></div><div><label>Start date</label><input id="es" type="date" value="${today()}"></div></div><label>Annual vacation days</label><input id="ea" type="number" min="0" value="21"><div class="act"><button type="button" class="btn" onclick="addEmp()">Add employee</button></div><small>New employees get a default Sun to Thu 09:00 to 17:00 schedule. Change it from Schedules.</small></div>
 ${S.staff.some(s=>s.on===false)?`<div class="box"><b>Former employees</b>${S.staff.filter(s=>s.on===false).map(s=>`<div class="row"><span>${h(s.name)} <small>resigned ${s.left?fd(s.left):''}</small></span><button type="button" class="btn g" onclick="rehire('${s.id}')">Reactivate</button></div>`).join('')}<small>Their history stays in the reports.</small></div>`:''}
 <div class="box"><label>Grace period (minutes)</label><input type="number" min="0" value="${S.set.grace}" onchange="setGrace(this.value)"></div>
 ${pinBox()}
 <div class="box"><b>Manual attendance edit</b><label>Employee</label><select id="ms">${opts(S.staff)}</select><div class="g2"><div><label>Date</label><input id="md" type="date" value="${today()}"></div><div><label>In / Out</label><span class="tm"><input id="mi" type="time"><input id="mo" type="time"></span></div></div><div class="act"><button type="button" class="btn" onclick="man(0)">Save</button><button type="button" class="btn g" onclick="man(1)">Clear day</button></div></div>
 <div class="box"><b>Linked phones</b><p class="sub" style="margin:4px 0 8px">Each employee phone is linked on their first sign-in. A check-in from a different phone is flagged on the Today tab. If someone changes phone, unlink the old one and their next sign-in links the new one.</p>${devList()}</div>
 <div class="box"><b>Backup &amp; restore</b><p class="sub" style="margin:4px 0 0">Save a copy of all the data, or load a saved copy back. Keep backups private: they contain names and records.</p><div class="act"><button type="button" class="btn" onclick="doBackup()">Backup</button><button type="button" class="btn g" onclick="doRestore()">Restore</button></div><textarea id="bk" placeholder="Backup text appears here. To restore, paste a backup here and press Restore."></textarea><label>Or choose a backup file</label><input type="file" accept=".json,application/json" onchange="readFile(this)"><div class="msg" id="bkm"></div><small>PINs are not part of the backup. They stay in Supabase.</small></div>
 <div class="box"><b>Reset</b><p class="sub" style="margin:4px 0 0">Make a backup first. Resets cannot be undone.</p><div class="act"><button type="button" class="btn r" onclick="resetRecords()">Reset records</button><button type="button" class="btn r" onclick="resetAll()">Reset everything</button></div><small>Reset records clears attendance, requests, deductions, holidays and date changes, and keeps the team, schedules and settings. Reset everything also clears linked phones, the office location and settings, and puts schedules back to the default. Employee accounts always stay.</small></div>`}

/* ---- backup / restore / reset (data lives in Supabase) ---- */
async function tblAll(n){let out=[],off=0;for(;;){const r=await tbl(n,'select=*&limit=1000&offset='+off);out=out.concat(r);if(r.length<1000)break;off+=1000}return out}
async function doBackup(){
 try{bkm('Preparing the backup...','late');
  const names=['profiles','settings','weekly_schedule','schedule_overrides','attendance','requests','deductions','holidays','devices'],o={app:'reception-team',version:1,at:new Date().toISOString(),data:{}};
  for(const n of names)o.data[n]=await tblAll(n);
  const t=JSON.stringify(o);$('#bk').value=t;let c=false;
  try{await navigator.clipboard.writeText(t);c=true}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='reception-team-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
  bkm((c?'Backup created and copied. ':'Backup created. Select the text above and copy it. ')+'Keep it private and safe.','ok')}
 catch(e){bkm('Backup failed: '+errTx(e),'abs')}}
const chunks=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
async function clearRecords(){
 await del('attendance','id=not.is.null');await del('requests','id=not.is.null');await del('deductions','id=not.is.null');
 await del('holidays','id=not.is.null');await del('schedule_overrides','staff_id=not.is.null')}
async function doRestore(){const t=$('#bk').value.trim();let o;
 try{o=JSON.parse(t)}catch(e){return bkm('That is not a valid backup.','abs')}
 if(!o||o.app!=='reception-team'||!o.data)return bkm('That is not a valid backup.','abs');
 if(!confirm('Restore this backup? It will replace the current attendance, requests, deductions, holidays and schedules.'))return;
 try{bkm('Restoring...','late');const D=o.data,have=new Set((await tbl('profiles','select=id')).map(p=>p.id)),keep=r=>have.has(r.staff_id);let skipped=0;
  for(const p of (D.profiles||[]))if(p.role==='employee'){if(have.has(p.id))await upd('profiles','id=eq.'+p.id,{name:p.name,annual:p.annual,start_date:p.start_date,left_date:p.left_date,active:p.active,approved:p.approved});else skipped++}
  const s0=(D.settings||[])[0];if(s0)await upd('settings','id=eq.1',{grace:s0.grace,radius:s0.radius,office_lat:s0.office_lat,office_lng:s0.office_lng});
  await clearRecords();await del('devices','device_id=not.is.null');
  const put=async(n,rows,strip)=>{const r=(rows||[]).filter(keep).map(x=>{const y=Object.assign({},x);(strip||[]).forEach(k=>delete y[k]);return y});for(const c of chunks(r,200))if(c.length)await ins(n,c)};
  await upsertChunks('weekly_schedule',(D.weekly_schedule||[]).filter(keep),'staff_id,dow');
  await put('schedule_overrides',D.schedule_overrides);await put('attendance',D.attendance,['id']);
  await put('requests',D.requests);await put('deductions',D.deductions);await put('devices',D.devices);
  const hol=(D.holidays||[]).map(x=>Object.assign({},x));for(const c of chunks(hol,200))if(c.length)await ins('holidays',c);
  await loadAll();render();alert('Backup restored'+(skipped?'. '+skipped+' employee(s) in the backup no longer have an account, so their data was skipped. Add them again from Admin.':''))}
 catch(e){bkm('Restore failed: '+errTx(e),'abs')}}
async function upsertChunks(n,rows,on){for(const c of chunks(rows,200))if(c.length)await upsert(n,c,on)}
async function resetRecords(){if(!confirm('Clear all attendance, requests, deductions, holidays and date changes? The team, schedules and settings stay. This cannot be undone. Make a backup first.'))return;
 try{await clearRecords();await loadAll();render();alert('Records cleared')}catch(e){alert('Could not reset: '+errTx(e))}}
async function resetAll(){if(!confirm('Reset EVERYTHING? All records, linked phones, schedules (back to the default), office location and settings will be cleared. Employee accounts stay (use Resign to remove someone). Make a backup first.'))return;if(!confirm('Are you sure? This cannot be undone.'))return;
 try{await clearRecords();await del('devices','device_id=not.is.null');
  await upsertChunks('weekly_schedule',S.staff.flatMap(s=>[0,1,2,3,4,5,6].map(i=>({staff_id:s.id,dow:i,start_time:i<5?'09:00':null,end_time:i<5?'17:00':null}))),'staff_id,dow');
  await upd('settings','id=eq.1',{office_lat:null,office_lng:null,radius:150,grace:15});
  await loadAll();render();alert('Everything was reset')}catch(e){alert('Could not reset: '+errTx(e))}}

function sizeSp(){const e=$('#stk'),hr=e.querySelector('.hero'),c=e.classList.contains('c');hr.style.transition='none';e.classList.remove('c');const H=e.offsetHeight;if(c)e.classList.add('c');void hr.offsetHeight;hr.style.transition='';$('#stkSp').style.height=H+'px'}
const _render=render;render=function(){bindDev();_render();sizeSp()};
addEventListener('hashchange',hs);addEventListener('resize',sizeSp);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
addEventListener('scroll',()=>{const e=$('#stk'),y=window.scrollY;if(y>80)e.classList.add('c');else if(y<20)e.classList.remove('c')},{passive:true});
</script>
